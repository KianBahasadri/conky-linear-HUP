<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Cairo's toy font API exposes only normal/bold. These private family
       aliases select the actual Plex 500/600 faces through Fontconfig. -->
  <match target="pattern">
    <test name="family"><string>Conky Plex Sans Medium</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Conky Plex Sans SemiBold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>IBM Plex Sans</string></edit>
    <edit name="weight" mode="assign"><const>demibold</const></edit>
  </match>
</fontconfig>
