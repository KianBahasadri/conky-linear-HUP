<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribution city — Cairo variety</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --ink: #e8e5e0;
    --muted: #8f8a82;
    --dim: #6b645a;
    --line: #2e2e2e;
    --accent: #d4af37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .wrap { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 80px; }
  header { padding: 8px 0 22px; border-bottom: 1px solid var(--line); }
  .kicker { color: var(--accent); font-size: 10px; letter-spacing: 0.18em; }
  h1 { margin: 12px 0 10px; font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.04em; }
  .lede { max-width: 720px; margin: 0; color: var(--muted); font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
  h2 { margin: 48px 0 8px; font-size: 13px; letter-spacing: 0.14em; color: var(--dim); }
  figure { margin: 16px 0 32px; padding: 0; }
  figure img { display: block; width: 100%; background: #111; border: 1px solid var(--line); }
  figcaption { margin-top: 10px; color: var(--muted); font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.5; }
  figcaption strong { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">GITHUB OVERLAY  ·  STUDY</div>
    <h1>Art deco city</h1>
    <p class="lede">Cairo variety on the live overlay camera. Quiet days are houses and shops. Busy days are Empire / Chrysler / setback towers. PixelLab did not survive this camera. Reload if the tab is stale.</p>
  </header>

  <h2>CAMERA</h2>
  <figure>
    <img src="00-shipped.png" alt="Live GitHub overlay">
    <figcaption><strong>Live overlay.</strong> Week axis flat, weekdays stacked up. This is the lattice.</figcaption>
  </figure>

  <h2>CAIRO VARIETY</h2>
  <figure>
    <img src="artdeco-cairo-types.png" alt="Catalog of Cairo building types">
    <figcaption><strong>Type sheet.</strong> House, shop, warehouse, walk-up, gothic, office, glass, setback, Chrysler, Empire, slab. Tops are hats and boxes, not sticks.</figcaption>
  </figure>
  <figure>
    <img src="artdeco-shipped.png" alt="Cairo variety at overlay size">
    <figcaption><strong>Overlay size.</strong> 1000×200, live lattice. Same box as the green bars.</figcaption>
  </figure>
  <figure>
    <img src="artdeco-shipped-zoom.png" alt="Cairo variety last 14 weeks">
    <figcaption><strong>Last 14 weeks.</strong> Pitched roofs in the quiet stretch, Empire / Chrysler in August.</figcaption>
  </figure>
  <figure>
    <img src="artdeco-cairo-closeup.png" alt="Cairo variety last 8 weeks">
    <figcaption><strong>Last 8 weeks.</strong></figcaption>
  </figure>
</div>
</body>
</html>
